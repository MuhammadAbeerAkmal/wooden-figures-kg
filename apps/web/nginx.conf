server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this server, so no CORS setup is needed.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    # Built assets have a content hash in their name and can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single page application: unknown paths (e.g. /compare/cq5) are handled by the React router.
    location / {
        try_files $uri /index.html;
    }
}
